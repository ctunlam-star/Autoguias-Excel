<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autoguía didáctica</title><style>
:root{--green:#096c53;--muted:#60716c;--line:#dbe5df;--bg:#f4f7f5;--dark:#183a31}*{box-sizing:border-box}body{font:16px/1.6 system-ui,'Segoe UI',Arial,sans-serif;margin:0;color:#24372f;background:var(--bg)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #e3bc48;outline-offset:2px}.wrap{max-width:1120px;margin:auto;padding:24px 16px}.hero{background:linear-gradient(125deg,#086a51,#17493e);color:white;padding:28px;border-radius:20px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.hero h1{margin:6px 0;font-size:clamp(24px,4vw,38px)}.hero small{opacity:.85}.author{border:1px solid #8fb7a7;border-radius:12px;padding:10px 16px;align-self:center;text-align:center}.progress{height:7px;border-radius:10px;background:#d5e1da;overflow:hidden;margin:17px 0 24px}.bar{height:100%;width:0;background:#159c75;transition:width .2s}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px}.sidebar,.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:20px}.sidebar{align-self:start}.sidebar button{border:0;background:transparent;display:block;width:100%;padding:12px;text-align:left;border-radius:10px;margin:3px 0;color:#364d43}.sidebar button.sel{background:#dff3ea;color:#055941;font-weight:700}.sidebar button span{color:#688d7f;margin-right:9px}.panel{min-height:370px}.eyebrow{color:#078363;font-size:12px;font-weight:750;letter-spacing:.09em;text-transform:uppercase}.panel h2{font-size:clamp(25px,3vw,34px);line-height:1.2;margin:10px 0 22px}.bodytext{white-space:pre-wrap}.callout{padding:18px;border-radius:14px;background:#eef7f2;border-left:5px solid #0a8a64;margin:15px 0}.formula{font:clamp(17px,2.7vw,27px)/1.55 Consolas,monospace;background:#132d3c;color:#d6ffe8;border-radius:12px;padding:19px;overflow-x:auto;white-space:pre-wrap;overflow-wrap:anywhere;margin:19px 0}.sheet{overflow:auto}.sheet table{border-collapse:collapse;width:100%;min-width:370px}.sheet th,.sheet td{border:1px solid #cddbd2;padding:10px 14px;text-align:left}.sheet th{background:#e4f2e9}.question{background:#f7faf7;padding:15px;border:1px solid #d4e3d8;border-radius:12px;margin-bottom:14px}.question label{display:block;padding:8px}.question input{margin-right:8px}.feedback{border-radius:9px;background:#e2f7e9;padding:10px;margin-top:10px}.feedback.bad{background:#fff1df}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:25px}button.action{padding:11px 18px;border:1px solid #abc5b7;border-radius:10px;background:white;color:#086a51;font-weight:650}button.action.primary{background:#086a51;color:white}button:disabled{opacity:.3;cursor:default}footer{margin:22px 0;color:#66776e;font-size:13px;text-align:center}@media(max-width:760px){.layout{grid-template-columns:1fr}.sidebar{display:flex;overflow:auto;gap:5px;padding:8px}.sidebar button{min-width:120px}.panel{padding:16px}}

/* Acceso para compartir y marca de autoria */
.pv-share{position:fixed;right:18px;bottom:18px;z-index:9000;background:#086b50;color:#fff;border:2px solid #fff;box-shadow:0 4px 18px #0003;border-radius:13px;padding:11px 17px;font:700 15px system-ui,sans-serif;cursor:pointer}
.pv-share:hover{background:#064c3a}.pv-share:focus-visible{outline:3px solid #f7c64c}
.pv-share-note{position:fixed;bottom:75px;right:18px;max-width:300px;padding:9px 13px;border-radius:9px;background:#143b30;color:white;font:13px system-ui;box-shadow:0 4px 14px #0003;z-index:9001;display:none}
body{padding-bottom:48px}
</style><meta name="author" content="Prof. Raúl Gómez"><meta name="copyright" content="© 2026 Prof. Raúl Gómez · Material didáctico"></head><body><button type="button" id="pvShareButton" class="pv-share" title="Copiar enlace de esta autoguía para MIEL">🔗 Compartir</button><div id="pvShareNote" role="status" aria-live="polite" class="pv-share-note"></div><div class="wrap"><header class="hero"><div><small id="topic"></small><h1 id="title"></h1><div id="subtitle"></div></div><div class="author"><strong id="author"></strong><br><small id="seal"></small></div></header><div class="progress"><div class="bar" id="bar"></div></div><div class="layout"><nav class="sidebar" id="side" aria-label="Pantallas"></nav><main class="panel"><div class="eyebrow" id="counter"></div><h2 id="heading"></h2><div id="body"></div><div class="nav"><button class="action" id="prev">← Anterior</button><button class="action primary" id="next">Continuar →</button></div></main></div><footer id="foot"></footer></div><script>
'use strict';const GUIDE={"title":"La función MAX de Excel","subtitle":"Encontrá el número más grande, paso a paso.","category":"MS-EXCEL · AUTOGUÍA INTERACTIVA","author":"Prof. Raúl Gómez","seal":"Material didáctico","pages":[{"type":"text","title":"¿Qué vamos a aprender?","body":"Hoy vamos a descubrir cómo encontrar el número más grande de una lista.\n\nImaginate cinco alumnos con distintas notas: ¿cuál fue la más alta?","example":"","formula":"","hint":"","table":"","question":"","options":"","correct":0,"explanation":""},{"type":"table","title":"Miremos las notas","body":"Observá las notas y buscá la más alta.","table":"Alumno|Nota\nMartina|8\nLucas|5\nSofía|9\nTomás|6\nValentina|7"},{"type":"formula","title":"Usamos MAX","body":"Si las notas están entre las celdas B2 y B6, escribimos:","formula":"=MAX(B2:B6)","hint":"El resultado es 9. La función devuelve el valor numérico más alto."},{"type":"quiz","title":"Comprobá lo aprendido","body":"Respondé y comprobá tu respuesta.","question":"¿Qué devuelve =MAX(12;25;18;40;30)?","options":"12|25|40|30","correct":2,"explanation":"40 es el valor máximo del conjunto."}]};let current=0;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.title=GUIDE.title+' · Autoguía';$('topic').textContent=GUIDE.category||'AUTOGUÍA INTERACTIVA';$('title').textContent=GUIDE.title;$('subtitle').textContent=GUIDE.subtitle||'';$('author').textContent=GUIDE.author;$('seal').textContent=GUIDE.seal;$('foot').textContent=GUIDE.author+' · '+GUIDE.seal+' · Material para trabajar a tu ritmo';function show(){let p=GUIDE.pages[current];$('bar').style.width=((current+1)/GUIDE.pages.length*100)+'%';$('counter').textContent='PANTALLA '+(current+1)+' DE '+GUIDE.pages.length;$('heading').textContent=p.title;$('side').innerHTML=GUIDE.pages.map((s,i)=>'<button class="'+(i===current?'sel':'')+'" data-id="'+i+'"><span>'+(i+1)+'.</span>'+esc(s.title)+'</button>').join('');$('side').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.id));let html='<div class="bodytext">'+esc(p.body)+'</div>';if(p.type==='formula')html+='<div class="formula">'+esc(p.formula)+'</div><div class="callout">'+esc(p.hint||'')+'</div>';if(p.type==='example')html+='<div class="callout"><strong>Ejemplo:</strong> '+esc(p.example)+'</div>';if(p.type==='table'){let lines=(p.table||'').trim().split(/\r?\n/).filter(Boolean).map(s=>s.split('|'));html+='<div class="sheet"><table>'+lines.map((row,i)=>'<tr>'+row.map(v=>'<'+(i===0?'th':'td')+'>'+esc(v.trim())+'</'+(i===0?'th':'td')+'>').join('')+'</tr>').join('')+'</table></div>'}if(p.type==='quiz'){const options=(p.options||'').split('|').map(s=>s.trim()).filter(Boolean);html+='<div class="question"><strong>'+esc(p.question)+'</strong>'+options.map((s,i)=>'<label><input type="radio" name="q" value="'+i+'">'+esc(s)+'</label>').join('')+'<button class="action primary" id="correct">Comprobar</button><div id="result"></div></div>'}if(p.type==='si'){html+='<div class="callout"><strong>Nota:</strong> <output id="val">8</output><br><input id="slider" type="range" min="1" max="10" value="8" style="width:100%"><div class="formula">=SI(B2>=6;"Aprobado";"Desaprobado")</div><strong>Resultado:</strong> <span id="status">Aprobado</span></div>'} $('body').innerHTML=html;if(p.type==='quiz'){const btn=$('correct');btn.onclick=()=>{let v=document.querySelector('input[name=q]:checked');if(!v){$('result').textContent='Seleccioná una respuesta.';return}let ok=Number(v.value)===Number(p.correct);$('result').className='feedback'+(ok?'':' bad');$('result').textContent=(ok?'¡Correcto! ':'Revisá la respuesta. ')+(p.explanation||'')}}if(p.type==='si'){$('slider').oninput=e=>{$('val').textContent=e.target.value;$('status').textContent=Number(e.target.value)>=6?'Aprobado':'Desaprobado'}}$('prev').disabled=current===0;$('next').textContent=current===GUIDE.pages.length-1?'Volver al inicio ↻':'Continuar →'}function go(i){current=Math.max(0,Math.min(i,GUIDE.pages.length-1));show();window.scrollTo({top:0,behavior:'smooth'})}$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current===GUIDE.pages.length-1?0:current+1);show();
</script><script>
(function(){
 const btn=document.getElementById('pvShareButton'), notice=document.getElementById('pvShareNote');
 const cleanUrl=location.href.split('#')[0].split('?')[0];
 btn.addEventListener('click',async()=>{
   let copied=false;
   try { if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(cleanUrl); copied=true; } } catch(e){}
   if(!copied){ try{const t=document.createElement('textarea');t.value=cleanUrl;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();copied=document.execCommand('copy');t.remove();}catch(e){}}
   notice.textContent=copied?'Enlace copiado. Pegalo en el hipervínculo de MIEL.':'No se pudo copiar automáticamente. Seleccioná la dirección del navegador (Ctrl+L) y copiala (Ctrl+C).';
   notice.style.display='block';window.setTimeout(()=>notice.style.display='none',5500);
 });
})();
</script></body></html>
