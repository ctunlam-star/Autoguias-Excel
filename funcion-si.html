<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autoguía interactiva · Función SI de Excel · Prof. Raúl Gómez</title>
<style>
:root{--green:#07694f;--dark:#12362e;--cream:#f6f8f5;--line:#dbe7e0;--ink:#1e3030;--muted:#596e68;--blue:#0c5d93;--yellow:#f7c64c;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--cream);font:16px/1.55 system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:var(--ink)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #f1b94a;outline-offset:2px}.shell{max-width:1140px;margin:auto;padding:24px 18px 45px}.top{background:var(--dark);border-radius:22px;color:white;padding:26px 30px;display:flex;align-items:center;justify-content:space-between;gap:20px;box-shadow:0 8px 24px #1e493c1c}.eyebrow{font-weight:750;letter-spacing:.13em;text-transform:uppercase;font-size:.71rem;color:#a9d8c7}.top h1{font-size:clamp(1.7rem,3.2vw,2.65rem);margin:3px 0 4px;line-height:1.14}.top p{margin:0;color:#d7e7df}.author{background:#0b7958;border:1px solid #55a58a;border-radius:12px;padding:9px 14px;min-width:196px;font-size:.91rem;text-align:right}.author strong{display:block;color:white}.author small{color:#d1eddf}.progressHead{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:22px 0 8px;font-weight:700;color:var(--muted)}.progressTrack{height:10px;border-radius:20px;background:#dce9e0;overflow:hidden}.progressFill{height:100%;background:linear-gradient(90deg,#0f8e69,#63b692);width:12.5%;transition:width .3s}.layout{display:grid;grid-template-columns:232px 1fr;gap:20px;margin-top:20px}.side{background:white;border:1px solid var(--line);border-radius:18px;padding:14px;height:max-content}.side button{border:0;background:transparent;width:100%;display:flex;text-align:left;align-items:center;gap:12px;padding:12px 9px;border-radius:10px;color:#3b574e;font-weight:650;font-size:.88rem}.side button.active{background:#e7f5ed;color:#075f47}.side button:hover{background:#f0f7f2}.side .num{width:29px;height:29px;display:grid;place-items:center;flex-shrink:0;border-radius:50%;background:#edf2ef}.side button.active .num{background:var(--green);color:white}.panel{background:white;border-radius:18px;border:1px solid var(--line);box-shadow:0 5px 20px #285b3910;min-height:520px;padding:clamp(20px,4vw,42px)}.panel h2{font-size:clamp(1.4rem,2.4vw,2rem);line-height:1.25;margin:5px 0 13px}.kicker{color:var(--green);font-weight:800;font-size:.75rem;text-transform:uppercase;letter-spacing:.1em}.lead{font-size:1.08rem;max-width:730px}.alert{background:#ecf7f0;border-left:5px solid #0c9167;padding:15px 18px;border-radius:9px;margin:20px 0}.alert strong{color:#07694f}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.scenario{border-radius:16px;padding:20px;border:1px solid var(--line);background:#f9fbfa}.scenario strong{display:block;font-size:1.05rem}.choice{padding:11px 16px;display:inline-block;border-radius:999px;background:#e5f3ea;color:#055b40;font-weight:800;margin-top:8px}.wrong{background:#fff0ec;color:#a14331}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:12px;margin:20px 0}table{width:100%;border-collapse:collapse;min-width:400px}th{background:#e9f4ed;text-align:left;color:#194a38}th,td{padding:12px 15px;border-bottom:1px solid #e3ece6}tr:last-child td{border-bottom:0}.colCell{font-family:Consolas,monospace;color:#768b83;font-size:.78rem}.formula{font-family:Consolas,'Courier New',monospace;background:#142a36;color:#e0fff0;border-radius:12px;padding:19px 22px;overflow:auto;white-space:nowrap;font-size:clamp(.85rem,1.5vw,1.15rem);margin:16px 0}.f-blue{color:#79d9ff}.f-yellow{color:#ffe28e}.f-green{color:#8affb6}.controlbox{border:1px solid #cde2d5;border-radius:14px;padding:20px;background:#f5faf6}.range{width:100%;accent-color:var(--green);margin:13px 0}.bigNumber{font-size:3.3rem;font-weight:850;letter-spacing:-.05em;color:#094e3c;line-height:1}.status{padding:9px 16px;border-radius:99px;display:inline-flex;font-weight:800;color:white;background:#168b5d}.status.no{background:#c45e4a}.minor{color:var(--muted);font-size:.92rem}.btn{border:1px solid #c5ddd1;background:white;color:#075d43;border-radius:10px;padding:11px 17px;font-weight:750}.btn.primary{border-color:var(--green);background:var(--green);color:white}.btn:hover{filter:brightness(.97)}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:25px}.nav button:disabled{opacity:.35;cursor:not-allowed}.grid100{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;max-width:430px}.sq{aspect-ratio:1;background:#e0e9e4;border-radius:4px}.sq.on{background:#0c9064}.quizOpts{display:grid;gap:10px;margin:15px 0}.quizOpts label{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px 15px;cursor:pointer}.quizOpts label:has(input:checked){border-color:var(--green);background:#ecf8f0}.feedback{padding:12px 15px;border-radius:10px;background:#ebf8f1;margin-top:10px;color:#09523b;font-weight:700}.feedback.bad{background:#fff1ec;color:#8e3d2f}.score{font-size:2.8rem;color:#07694f;font-weight:850}.tiny{font-size:.82rem;color:var(--muted)}footer{margin-top:19px;text-align:center;color:#6c8078;font-size:.85rem}.printOnly{display:none} .exampleMoney{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.money{padding:17px 24px;border-radius:12px;background:#f3e8c2;font-size:1.4rem;font-weight:800;color:#55441e}@media(max-width:740px){.layout{display:block}.side{display:flex;gap:5px;overflow-x:auto;margin-bottom:15px;padding:8px}.side button{width:42px;min-width:42px;padding:7px;justify-content:center}.side .label{display:none}.top{align-items:flex-start;flex-direction:column}.author{text-align:left}.two{grid-template-columns:1fr}.panel{min-height:480px}.shell{padding:10px 10px 20px}}@media print{.side,.nav,.progressHead,.progressTrack,.noprint{display:none!important}.layout{display:block}.top{color:black;background:white;box-shadow:none}.author{color:black}.panel{border:0;box-shadow:none}.shell{max-width:none}.printOnly{display:block}}
</style>
</head>
<body><div class="shell"><header class="top"><div><div class="eyebrow">MS-Excel · Autoguía interactiva</div><h1>La función lógica SI</h1><p>Aprendé a tomar decisiones en Excel, paso a paso y a tu ritmo.</p></div><div class="author"><strong>Prof. Raúl Gómez</strong><small>Material didáctico</small></div></header>
<div class="progressHead"><span id="stepCount">Pantalla 1 de 8</span><span id="stepTitle">Empezamos</span></div><div class="progressTrack"><div class="progressFill" id="bar"></div></div>
<div class="layout"><aside class="side" id="side" aria-label="Navegación de la autoguía"></aside><main class="panel"><section id="content" aria-live="polite"></section><div class="nav"><button type="button" class="btn" id="prev">← Anterior</button><button type="button" class="btn primary" id="next">Continuar →</button></div></main></div><footer>Prof. Raúl Gómez · Material didáctico · Autoguía offline · No requiere conexión a Internet</footer></div>
<script>
'use strict';
const names=['Empezamos','¿Qué es una condición?','Una planilla real','La fórmula SI','Probalo vos','Un detalle importante','Errores frecuentes','Desafío final'];
let step=0,note=8,answer='',quiz={};
const $=id=>document.getElementById(id);
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const formula='<span class="f-blue">=SI</span>(<span class="f-yellow">B2&gt;=6</span>;<span class="f-green">"Aprobado"</span>;<span class="f-green">"Desaprobado"</span>)';
function draw(){
$('stepCount').textContent='Pantalla '+(step+1)+' de 8';$('stepTitle').textContent=names[step];$('bar').style.width=((step+1)/8*100)+'%';
$('side').innerHTML=names.map((n,i)=>`<button type="button" class="${i===step?'active':''}" data-step="${i}" aria-current="${i===step?'step':'false'}"><span class="num">${i+1}</span><span class="label">${escapeHTML(n)}</span></button>`).join('');
$('side').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.step)));
const pages=[
`<div class="kicker">01 · Objetivo</div><h2>¿Y si Excel pudiera tomar decisiones?</h2><p class="lead">Todos los días tomamos decisiones: <strong>si</strong> pasa algo, hacemos una cosa; <strong>si no</strong>, hacemos otra.</p><div class="two"><div class="scenario"><strong>Si terminás la tarea…</strong><span class="choice">Podés salir a jugar</span></div><div class="scenario"><strong>Si no terminás la tarea…</strong><span class="choice wrong">Seguís estudiando</span></div></div><div class="alert"><strong>La idea clave:</strong> la función <strong>SI</strong> permite que Excel elija entre dos resultados según se cumpla o no una condición.</div><p>En esta autoguía vas a entender la función, ver una fórmula real, experimentar con notas y resolver actividades.</p>`,
`<div class="kicker">02 · Concepto</div><h2>¿Qué es una condición?</h2><p class="lead">Una condición es una pregunta que solamente admite dos respuestas: <strong>verdadero</strong> o <strong>falso</strong>.</p><div class="two"><div class="scenario"><div class="minor">Condición</div><strong>¿8 es mayor o igual a 6?</strong><span class="choice">VERDADERO</span></div><div class="scenario"><div class="minor">Condición</div><strong>¿4 es mayor o igual a 6?</strong><span class="choice wrong">FALSO</span></div></div><div class="alert"><strong>Para recordar:</strong> Excel no adivina. Nosotros escribimos la condición y le indicamos qué devolver si es verdadera y qué devolver si es falsa.</div>`,
`<div class="kicker">03 · Ejemplo</div><h2>Tenemos una lista de notas</h2><p>Supongamos que un alumno aprueba una evaluación con <strong>6 o más</strong>. Queremos que Excel complete la columna «Resultado».</p><div class="tableWrap"><table><thead><tr><th>Celda</th><th>Alumno</th><th>Nota</th><th>Resultado</th></tr></thead><tbody><tr><td class="colCell">Fila 2</td><td>Martina</td><td>8</td><td><span class="status">Aprobado</span></td></tr><tr><td class="colCell">Fila 3</td><td>Lucas</td><td>4</td><td><span class="status no">Desaprobado</span></td></tr><tr><td class="colCell">Fila 4</td><td>Sofía</td><td>6</td><td><span class="status">Aprobado</span></td></tr></tbody></table></div><p class="minor">Pensá: ¿qué tiene en común cada alumno que aparece como aprobado?</p>`,
`<div class="kicker">04 · Fórmula</div><h2>Así se escribe en Excel</h2><p>Si la nota está en la celda <strong>B2</strong>, escribimos en <strong>C2</strong>:</p><div class="formula">${formula}</div><div class="two"><div class="scenario"><strong>1. B2&gt;=6</strong><p>Es la condición: «¿la nota es mayor o igual a 6?».</p></div><div class="scenario"><strong>2. "Aprobado"</strong><p>Lo que muestra si la condición es verdadera.</p></div><div class="scenario"><strong>3. "Desaprobado"</strong><p>Lo que muestra si es falsa.</p></div><div class="scenario"><strong>4. Los puntos y coma</strong><p>Separan las tres partes de la función en esta configuración de Excel en español.</p></div></div><div class="alert">Los textos van entre comillas. La función empieza con <strong>=</strong> y termina con <strong>)</strong>.</div>`,
`<div class="kicker">05 · Experimento</div><h2>Cambiá la nota y mirá qué pasa</h2><p>Deslizá el control. Excel evaluaría la misma fórmula, pero mostraría un resultado distinto según el valor de B2.</p><div class="controlbox"><div class="two" style="align-items:center"><div><div class="minor">Valor de la celda B2</div><div id="bigNumber" class="bigNumber">${note}</div></div><div><div class="minor">Resultado en C2</div><span id="liveStatus" class="status ${note<6?'no':''}">${note>=6?'Aprobado':'Desaprobado'}</span></div></div><input class="range" id="noteSlider" type="range" min="1" max="10" value="${note}" step="1" aria-label="Nota del alumno"><div class="formula" style="margin-bottom:0">${formula}</div></div><p class="minor">Probá con 4, 6 y 9. ¿En qué número cambia el resultado?</p>`,
`<div class="kicker">06 · Atención</div><h2>«Mayor o igual» no es lo mismo que «mayor»</h2><p class="lead">El símbolo <strong>&gt;=</strong> significa <strong>mayor o igual que</strong>.</p><div class="two"><div class="scenario"><strong>B2 = 6</strong><p>¿6 es mayor o igual a 6?</p><span class="choice">Sí → Aprobado</span></div><div class="scenario"><strong>B2 = 5</strong><p>¿5 es mayor o igual a 6?</p><span class="choice wrong">No → Desaprobado</span></div></div><div class="alert">Si escribieras solamente <strong>&gt;6</strong>, la nota 6 no aprobaría. <strong>Un solo signo puede cambiar el resultado.</strong></div>`,
`<div class="kicker">07 · Para revisar</div><h2>Tres errores habituales</h2><div class="two"><div class="scenario"><strong>Olvidar el signo igual</strong><p>Una fórmula siempre empieza por <strong>=</strong>.</p></div><div class="scenario"><strong>Escribir mal el límite</strong><p><strong>&gt;6</strong> no incluye el 6. <strong>&gt;=6</strong> sí lo incluye.</p></div><div class="scenario"><strong>Olvidar las comillas</strong><p>Los resultados escritos como texto necesitan comillas: <strong>"Aprobado"</strong>.</p></div><div class="scenario"><strong>Confundir la celda</strong><p>Si la nota está en B2, la condición debe consultar <strong>B2</strong>, no otra celda.</p></div></div><p>Antes de copiar una fórmula a muchas filas, comprobá que funciona con dos o tres casos distintos.</p>`,
`<div class="kicker">08 · Evaluación</div><h2>Comprobemos si lo entendiste</h2><p>Elegí una respuesta en cada pregunta. Podés corregirlas y repetir el ejercicio todas las veces que quieras.</p><div id="quizArea"></div><div id="gradeArea"></div>`
];
$('content').innerHTML=pages[step];
if(step===4){$('noteSlider').addEventListener('input',e=>{note=Number(e.target.value);$('bigNumber').textContent=note;let r=$('liveStatus');r.textContent=note>=6?'Aprobado':'Desaprobado';r.className='status '+(note<6?'no':'')});}
if(step===7)drawQuiz();$('prev').disabled=step===0;$('next').textContent=step===7?'Reiniciar autoguía ↻':'Continuar →';
}
const questions=[{q:'1. Si B2 vale 6, ¿cuál será el resultado?',opts:['Desaprobado','Aprobado','Error'],correct:1,why:'La comparación es mayor o igual a 6, así que el 6 aprueba.'},{q:'2. ¿Qué significa el primer argumento de la función SI?',opts:['El resultado falso','La condición que debe comprobarse','El nombre de una hoja'],correct:1,why:'Primero Excel evalúa una condición, que será verdadera o falsa.'},{q:'3. ¿Qué devuelve =SI(B2>=6;"Aprobado";"Desaprobado") cuando B2 vale 4?',opts:['Aprobado','4','Desaprobado'],correct:2,why:'Como 4 no cumple la condición, Excel devuelve el resultado falso.'}];
function drawQuiz(){let a=$('quizArea');a.innerHTML=questions.map((x,i)=>`<div class="scenario" style="margin:13px 0"><strong>${escapeHTML(x.q)}</strong><div class="quizOpts">${x.opts.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}" ${quiz[i]===j?'checked':''}>${escapeHTML(o)}</label>`).join('')}</div></div>`).join('')+'<button type="button" class="btn primary" id="gradeBtn">Corregir respuestas</button>';$('quizArea').querySelectorAll('input').forEach(x=>x.addEventListener('change',e=>{quiz[+e.target.name.slice(1)]=+e.target.value;$('gradeArea').innerHTML=''}));$('gradeBtn').addEventListener('click',()=>{let count=questions.filter((q,i)=>quiz[i]===q.correct).length;let html=`<div class="alert"><div class="score">${count} / ${questions.length}</div><strong>${count===3?'¡Excelente! Entendiste la función SI.':'Buen intento. Revisá las explicaciones y volvé a probar.'}</strong></div>`;questions.forEach((q,i)=>{html+=`<div class="feedback ${quiz[i]===q.correct?'':'bad'}">${i+1}. ${quiz[i]===q.correct?'Correcto.':'Para revisar.'} ${escapeHTML(q.why)}</div>`});$('gradeArea').innerHTML=html;});}
function go(i){step=Math.max(0,Math.min(7,i));draw();window.scrollTo({top:0,behavior:'smooth'});} $('prev').addEventListener('click',()=>go(step-1));$('next').addEventListener('click',()=>{if(step===7){quiz={};answer='';note=8;go(0);}else go(step+1)});draw();
</script></body></html>
