<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="author" content="Prof. Raúl Gómez"><meta name="copyright" content="© 2026 Prof. Raúl Gómez - Material didáctico"><title>Porcentajes desde cero | Prof. Raúl Gómez</title><style>:root{--green:#07684d;--ink:#19342d;--bg:#f3f7f5;--line:#d9e8df;--muted:#5c7569}*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e6b643;outline-offset:2px}.wrap{max-width:1080px;margin:auto;padding:20px}.hero{background:#12382d;color:white;padding:23px 27px;border-radius:19px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}.hero h1{font-size:clamp(23px,4vw,34px);margin:7px 0}.eyebrow{color:#a7dfc7;font-size:12px;font-weight:750;letter-spacing:.12em;text-transform:uppercase}.author{text-align:center;background:#0a7655;border-radius:10px;padding:11px 16px;line-height:1.7;font-size:13px}.author strong{display:block}.progress{display:flex;gap:5px;margin:19px 0}.prog{flex:1;background:#d8e6de;height:8px;border:0;border-radius:10px;padding:0}.prog.on{background:#0f9871}.gridlayout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px}.nav,.panel{border-radius:17px;background:white;border:1px solid var(--line)}.nav{padding:13px;align-self:start}.nav button{display:block;border:0;background:white;border-radius:8px;padding:10px;text-align:left;width:100%;font-size:13px;color:#325649}.nav button.on{background:#e4f4eb;font-weight:800;color:#075e45}.panel{padding:clamp(20px,4vw,36px);min-height:420px}.panel h2{font-size:clamp(24px,3vw,34px);margin:8px 0 15px}.panel p{font-size:17px;line-height:1.75}.kicker{color:var(--green);font-size:12px;font-weight:800;letter-spacing:.1em}.tip{background:#eaf6ef;border-left:5px solid #08765a;padding:17px;border-radius:11px;margin:20px 0;line-height:1.65}.formula{background:#142e3c;color:#dcfff0;font:clamp(16px,2.5vw,23px)/1.65 Consolas,monospace;border-radius:12px;padding:18px;white-space:pre-wrap;overflow-wrap:anywhere}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.control{margin:20px 0;padding:20px;border:1px solid var(--line);background:#f8fbf9;border-radius:13px}.control input[type=number]{max-width:140px;padding:9px;border:1px solid #b5cec0;border-radius:8px}.control select{padding:9px;border-radius:8px;border:1px solid #b5cec0}.value{font-size:24px;font-weight:800;color:var(--green)}.chips{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:480px;margin:16px 0}.chip{aspect-ratio:1;border-radius:3px;background:#dbe8e1}.chip.fill{background:#0e9672}.sheet{overflow:auto;margin:18px 0}.sheet table{border-collapse:collapse;width:100%}.sheet th,.sheet td{border:1px solid #c7d9ce;padding:11px;text-align:left}.sheet th{background:#e7f4eb}.q{background:#f7faf8;border:1px solid var(--line);padding:15px;border-radius:12px;margin:12px 0}.q label{display:block;margin:9px 0;cursor:pointer}.q input{margin-right:9px}.feedback{border-radius:10px;padding:14px;margin-top:15px;background:#e6f5ec}.btn{border:1px solid #bed7c7;background:white;color:#126049;border-radius:10px;padding:11px 18px;font-weight:700}.btn.primary{color:white;background:#087258;border-color:#087258}.btn:disabled{opacity:.45;cursor:default}.footnav{display:flex;justify-content:space-between;gap:8px;margin-top:32px}footer{color:#59756a;text-align:center;font-size:12px;padding:20px}.tag{font-size:12px;background:#e5f3ea;color:#096048;border-radius:20px;padding:6px 11px}.small{font-size:14px!important;color:var(--muted)}@media(max-width:720px){.gridlayout{grid-template-columns:1fr}.nav{display:flex;overflow:auto;gap:6px}.nav button{min-width:130px}.hero{padding:20px}}</style></head><body><div class="wrap"><header class="hero"><div><div class="eyebrow">Excel · Nivel I · Autoguía interactiva</div><h1>Porcentajes desde cero</h1><div>Descuentos, aumentos y cálculos cotidianos</div></div><div class="author"><strong>Prof. Raúl Gómez</strong>Material didáctico</div></header><div id="progress" class="progress"></div><div class="gridlayout"><nav id="nav" class="nav" aria-label="Pantallas de la autoguía"></nav><main id="panel" class="panel"></main></div><footer>© 2026 Prof. Raúl Gómez · Material didáctico · Nivel I · Excel</footer></div><script>
const guide={"slug":"porcentajes-excel","title":"Porcentajes desde cero","subtitle":"Descuentos, aumentos y cálculos cotidianos","level":"Nivel I","slides":[{"t":"¿Qué significa porcentaje?","body":"Porcentaje significa 'de cada cien'. El 20 % representa 20 de cada 100 partes. Es una manera de comparar cantidades.","fact":"50 % es la mitad; 25 % es la cuarta parte; 10 % es una décima parte."},{"t":"De cada cien","body":"En esta cuadrícula hay 100 casilleros. Cada casillero representa 1 %. Mirá qué ocurre cuando cambiás el porcentaje.","visual":"hundred"},{"t":"Calcular un porcentaje","body":"Si una campera cuesta $50.000 y tiene un descuento del 20 %, primero calculamos cuánto dinero representa ese porcentaje.","formula":"=50000*20%","fact":"El descuento es de $10.000."},{"t":"Calcular el precio final","body":"No confundamos el importe del descuento con el precio a pagar. Primero calculamos el descuento y después lo restamos del precio inicial.","formula":"=50000-(50000*20%)","fact":"Pagamos $40.000."},{"t":"Trabajar con celdas","body":"Si B2 contiene $50.000 y C2 contiene 20 %, la fórmula D2 puede calcular el descuento. Otra celda puede calcular el precio final.","table":[["Precio","Descuento %","Importe descontado"],["50000","20%","10000"]],"formula":"=B2*C2"},{"t":"¿Y si hay un aumento?","body":"Para aumentar un precio, el porcentaje se suma en lugar de restarse. Por ejemplo, con un aumento del 10 %.","formula":"=50000*(1+10%)","fact":"El nuevo precio es $55.000."},{"t":"Probá con tus propios números","body":"Cambiá el precio y el descuento. Observá cuánto ahorrás y cuánto terminás pagando.","visual":"discount"},{"t":"Desafío final","body":"Respondé estas preguntas para comprobar lo aprendido.","quiz":[["¿Cuánto es el 10 % de 200?",["10","20","200"],1,"El 10 % equivale a 10 de cada 100; de 200 son 20."],["¿Cuánto se paga por $1000 con un 20 % de descuento?",["800","200","1200"],0,"20 % de 1000 es 200; pagás 1000 - 200 = 800."],["¿Qué fórmula calcula el 15 % del valor de B2?",["=B2+15%","=B2*15%","=B2/15%"],1,"Multiplicamos el precio por la tasa expresada como porcentaje."]]}]}; let current=0, selected={}, checked=false;const byId=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function table(rows){return '<div class="sheet"><table>'+rows.map((row,i)=>'<tr>'+row.map(c=>'<'+(i?'td':'th')+'>'+esc(c)+'</'+(i?'td':'th')+'>').join('')+'</tr>').join('')+'</table></div>'}
function widget(type){if(type==='grid'){return '<div class="sheet"><table><tr><th></th><th>A</th><th>B</th><th>C</th></tr>'+[1,2,3,4].map(i=>'<tr><th>'+i+'</th>'+['A','B','C'].map(c=>'<td style="'+(c==='B'&&i===3?'background:#bde8d3;font-weight:800':'')+'">'+(c==='B'&&i===3?'B3':'&nbsp;')+'</td>').join('')+'</tr>').join('')+'</table></div>'}
if(type==='cellpick')return '<div class="control"><div class="row"><label>Columna <select id="column"><option>A</option><option selected>B</option><option>C</option><option>D</option></select></label><label>Fila <select id="fil"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label></div><p>Referencia: <span class="value" id="ref">B3</span></p></div>';
if(type==='calculator')return '<div class="control"><div class="row"><label>Número 1 <input type="number" id="a" value="12"></label><label>Operación <select id="op"><option value="+">+</option><option value="-">−</option><option value="*">×</option><option value="/">÷</option></select></label><label>Número 2 <input type="number" id="b" value="4"></label></div><p>Resultado: <span class="value" id="result">16</span></p><div class="formula" id="formu">=12+4</div></div>';
if(type==='reference')return '<div class="control"><div class="row"><label>Referencia inicial <select id="anchor"><option value="B2">B2 (relativa)</option><option value="$B$2">$B$2 (absoluta)</option><option value="B$2">B$2 (fila fija)</option><option value="$B2">$B2 (columna fija)</option></select></label><label>Copiar de C2 hacia <select id="shift"><option value="down">C3 (una fila abajo)</option><option value="right">D2 (una columna a la derecha)</option></select></label></div><p>Al copiar, la referencia queda: <span id="ref" class="value">B3</span></p></div>';
if(type==='hundred')return '<div class="control"><label>Porcentaje: <span class="value" id="pct">20%</span><br><input type="range" id="rate" min="0" max="100" value="20" style="width:min(100%,480px)"></label><div class="chips" id="chips"></div><p id="explain" class="small"></p></div>';
if(type==='discount')return '<div class="control"><div class="row"><label>Precio $ <input type="number" min="0" id="price" value="50000"></label><label>Descuento % <input type="number" min="0" max="100" id="discount" value="20"></label></div><p>Descuento: <span id="saved" class="value">$10.000</span></p><p>Precio final: <span id="final" class="value">$40.000</span></p><div class="formula">=Precio*(1-Descuento%)</div></div>';return ''}
function draw(){byId('progress').innerHTML=guide.slides.map((_,i)=>'<button aria-label="Ir a pantalla '+(i+1)+'" class="prog '+(i<=current?'on':'')+'" data-go="'+i+'"></button>').join('');byId('nav').innerHTML=guide.slides.map((s,i)=>'<button class="'+(i===current?'on':'')+'" data-go="'+i+'">'+(i+1)+'. '+esc(s.t)+'</button>').join('');let s=guide.slides[current];let html='<div class="kicker">PANTALLA '+(current+1)+' DE '+guide.slides.length+'</div><h2>'+esc(s.t)+'</h2><p>'+esc(s.body)+'</p>';if(s.formula)html+='<div class="formula">'+esc(s.formula)+'</div>';if(s.table)html+=table(s.table);if(s.visual)html+=widget(s.visual);if(s.fact)html+='<div class="tip"><strong>Recordá:</strong> '+esc(s.fact)+'</div>';if(s.quiz){html+=s.quiz.map((q,i)=>'<div class="q"><strong>'+(i+1)+'. '+esc(q[0])+'</strong>'+q[1].map((o,j)=>'<label><input name="q'+i+'" type="radio" value="'+j+'" '+(selected[i]===j?'checked':'')+'>'+esc(o)+'</label>').join('')+'</div>').join('')+'<button class="btn primary" id="grade">Corregir respuestas</button><div id="feedback" role="status"></div>'}html+='<div class="footnav"><button class="btn" id="back" '+(current===0?'disabled':'')+'>← Anterior</button><button class="btn primary" id="next">'+(current===guide.slides.length-1?'Volver al inicio':'Continuar →')+'</button></div>';byId('panel').innerHTML=html;byId('back').onclick=()=>go(current-1);byId('next').onclick=()=>go(current===guide.slides.length-1?0:current+1);document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));if(s.quiz){document.querySelectorAll('[name^="q"]').forEach(x=>x.onchange=()=>{selected[+x.name.slice(1)]=+x.value;checked=false;byId('feedback').innerHTML=''});byId('grade').onclick=()=>{const correct=s.quiz.filter((q,i)=>selected[i]===q[2]).length;byId('feedback').innerHTML='<div class="feedback"><strong>Resultado: '+correct+' de '+s.quiz.length+'</strong><br>'+s.quiz.map((q,i)=>(i+1)+'. '+(selected[i]===q[2]?'Correcto':'Para revisar')+': '+esc(q[3])).join('<br>')+'</div>'}}if(s.visual)attach(s.visual)}
function attach(type){if(type==='cellpick'){const upd=()=>byId('ref').textContent=byId('column').value+byId('fil').value;byId('column').onchange=upd;byId('fil').onchange=upd}
if(type==='calculator'){const upd=()=>{let a=+byId('a').value,b=+byId('b').value,op=byId('op').value;byId('result').textContent=op==='/'&&b===0?'#¡DIV/0!':String(op==='+'?a+b:op==='-'?a-b:op==='*'?a*b:a/b);byId('formu').textContent='='+a+op+b};['a','b','op'].forEach(x=>byId(x).oninput=upd)}
if(type==='reference'){const upd=()=>{let a=byId('anchor').value,sh=byId('shift').value;let col=a.includes('$B')?'$B':sh==='right'?'C':'B';let row=a.includes('$2')?'$2':sh==='down'?'3':'2';byId('ref').textContent=col+row};byId('anchor').onchange=upd;byId('shift').onchange=upd}
if(type==='hundred'){const upd=()=>{let v=+byId('rate').value;byId('pct').textContent=v+'%';byId('chips').innerHTML=Array.from({length:100},(_,i)=>'<div class="chip '+(i<v?'fill':'')+'"></div>').join('');byId('explain').textContent=v+' de cada 100 casilleros están coloreados.'};byId('rate').oninput=upd;upd()}
if(type==='discount'){const upd=()=>{let p=+byId('price').value,r=Math.min(100,Math.max(0,+byId('discount').value))/100;const fmt=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:2}).format(n);byId('saved').textContent=fmt(p*r);byId('final').textContent=fmt(p*(1-r))};byId('price').oninput=upd;byId('discount').oninput=upd}}
function go(i){current=Math.max(0,Math.min(guide.slides.length-1,i));draw();window.scrollTo({top:0,behavior:'smooth'})}draw();
</script></body></html>
